{
  "name": "deepresearch-local",
  "services": {
    "postgres": {
      "image": "pgvector/pgvector:pg16",
      "environment": {
        "POSTGRES_USER": "research",
        "POSTGRES_PASSWORD": "${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}",
        "POSTGRES_DB": "research"
      },
      "ports": [
        "127.0.0.1:5432:5432"
      ],
      "volumes": [
        "postgres:/var/lib/postgresql/data",
        "./infra/database/local-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U research -d research"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "valkey": {
      "profiles": [
        "observability"
      ],
      "image": "valkey/valkey:8.0.2",
      "command": [
        "valkey-server",
        "--appendonly",
        "yes"
      ],
      "volumes": [
        "valkey:/data"
      ]
    },
    "clickhouse": {
      "profiles": [
        "observability"
      ],
      "image": "clickhouse/clickhouse-server:24.12.3.47",
      "environment": {
        "CLICKHOUSE_DB": "default",
        "CLICKHOUSE_USER": "langfuse",
        "CLICKHOUSE_PASSWORD": "${LOCAL_CLICKHOUSE_PASSWORD:-local-clickhouse-only}"
      },
      "volumes": [
        "clickhouse:/var/lib/clickhouse"
      ],
      "ulimits": {
        "nofile": {
          "soft": 262144,
          "hard": 262144
        }
      }
    },
    "minio": {
      "profiles": [
        "observability"
      ],
      "image": "minio/minio:RELEASE.2025-04-22T22-12-26Z",
      "command": [
        "server",
        "/data",
        "--console-address",
        ":9001"
      ],
      "environment": {
        "MINIO_ROOT_USER": "localminio",
        "MINIO_ROOT_PASSWORD": "${LOCAL_MINIO_PASSWORD:-local-minio-password}"
      },
      "volumes": [
        "minio:/data"
      ],
      "ports": [
        "127.0.0.1:9000:9000",
        "127.0.0.1:9001:9001"
      ]
    },
    "langfuse": {
      "profiles": [
        "observability"
      ],
      "image": "langfuse/langfuse:3.133.0",
      "environment": {
        "DATABASE_URL": "postgresql://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/langfuse",
        "NEXTAUTH_URL": "http://localhost:3001",
        "NEXTAUTH_SECRET": "${LOCAL_LANGFUSE_AUTH_SECRET:-local-auth-secret-change-before-use}",
        "SALT": "${LOCAL_LANGFUSE_SALT:-local-salt-change-before-use}",
        "ENCRYPTION_KEY": "${LOCAL_LANGFUSE_ENCRYPTION_KEY:?set 64 hex characters}",
        "CLICKHOUSE_URL": "http://clickhouse:8123",
        "CLICKHOUSE_MIGRATION_URL": "clickhouse://clickhouse:9000",
        "CLICKHOUSE_USER": "langfuse",
        "CLICKHOUSE_PASSWORD": "${LOCAL_CLICKHOUSE_PASSWORD:-local-clickhouse-only}",
        "CLICKHOUSE_CLUSTER_ENABLED": "false",
        "REDIS_HOST": "valkey",
        "REDIS_PORT": "6379",
        "LANGFUSE_S3_EVENT_UPLOAD_BUCKET": "langfuse",
        "LANGFUSE_S3_EVENT_UPLOAD_REGION": "us-east-1",
        "LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT": "http://minio:9000",
        "LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID": "localminio",
        "LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY": "${LOCAL_MINIO_PASSWORD:-local-minio-password}",
        "LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE": "true",
        "TELEMETRY_ENABLED": "false",
        "AUTH_DISABLE_SIGNUP": "true"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "valkey": {
          "condition": "service_started"
        },
        "clickhouse": {
          "condition": "service_started"
        },
        "minio": {
          "condition": "service_started"
        },
        "minio-init": {
          "condition": "service_completed_successfully"
        }
      },
      "ports": [
        "127.0.0.1:3001:3000"
      ]
    },
    "langfuse-worker": {
      "profiles": [
        "observability"
      ],
      "image": "langfuse/langfuse-worker:3.133.0",
      "environment": {
        "DATABASE_URL": "postgresql://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/langfuse",
        "NEXTAUTH_URL": "http://localhost:3001",
        "NEXTAUTH_SECRET": "${LOCAL_LANGFUSE_AUTH_SECRET:-local-auth-secret-change-before-use}",
        "SALT": "${LOCAL_LANGFUSE_SALT:-local-salt-change-before-use}",
        "ENCRYPTION_KEY": "${LOCAL_LANGFUSE_ENCRYPTION_KEY:?set 64 hex characters}",
        "CLICKHOUSE_URL": "http://clickhouse:8123",
        "CLICKHOUSE_MIGRATION_URL": "clickhouse://clickhouse:9000",
        "CLICKHOUSE_USER": "langfuse",
        "CLICKHOUSE_PASSWORD": "${LOCAL_CLICKHOUSE_PASSWORD:-local-clickhouse-only}",
        "CLICKHOUSE_CLUSTER_ENABLED": "false",
        "REDIS_HOST": "valkey",
        "REDIS_PORT": "6379",
        "LANGFUSE_S3_EVENT_UPLOAD_BUCKET": "langfuse",
        "LANGFUSE_S3_EVENT_UPLOAD_REGION": "us-east-1",
        "LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT": "http://minio:9000",
        "LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID": "localminio",
        "LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY": "${LOCAL_MINIO_PASSWORD:-local-minio-password}",
        "LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE": "true",
        "TELEMETRY_ENABLED": "false",
        "AUTH_DISABLE_SIGNUP": "true"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "valkey": {
          "condition": "service_started"
        },
        "clickhouse": {
          "condition": "service_started"
        },
        "minio": {
          "condition": "service_started"
        },
        "minio-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "minio-init": {
      "profiles": [
        "observability"
      ],
      "image": "minio/mc:RELEASE.2025-04-16T18-13-26Z",
      "entrypoint": [
        "/bin/sh",
        "-ec"
      ],
      "command": [
        "attempt=0; until mc alias set local http://minio:9000 localminio \"$$MINIO_PASSWORD\"; do attempt=$$((attempt+1)); test \"$$attempt\" -lt 60 || exit 1; sleep 2; done; mc mb --ignore-existing local/langfuse"
      ],
      "environment": {
        "MINIO_PASSWORD": "${LOCAL_MINIO_PASSWORD:-local-minio-password}"
      },
      "depends_on": [
        "minio"
      ]
    },
    "migrate": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.backend",
        "target": "runtime",
        "args": {
          "INSTALL_EXTRAS": "${INSTALL_EXTRAS:-}"
        }
      },
      "environment": {
        "ENVIRONMENT": "local",
        "MODEL_PROVIDER": "${MODEL_PROVIDER:-fake}",
        "BEDROCK_MODEL_ID": "${BEDROCK_MODEL_ID:-}",
        "AWS_REGION": "${AWS_REGION:-us-east-1}",
        "DATABASE_URL": "postgresql+psycopg://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/research",
        "STORAGE_BACKEND": "local",
        "STORAGE_PATH": "/app/local-data/uploads",
        "EMBEDDING_PROVIDER": "fake",
        "BOOTSTRAP_OWNER_EMAIL": "demo@example.test",
        "TAVILY_API_KEY": "${TAVILY_API_KEY:-}",
        "LANGSMITH_TRACING": "false",
        "LANGCHAIN_TRACING_V2": "false"
      },
      "volumes": [
        "application-data:/app/local-data"
      ],
      "command": [
        "python",
        "-m",
        "research_app.manage",
        "migrate"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "api": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.backend",
        "target": "runtime",
        "args": {
          "INSTALL_EXTRAS": "${INSTALL_EXTRAS:-}"
        }
      },
      "environment": {
        "ENVIRONMENT": "local",
        "MODEL_PROVIDER": "${MODEL_PROVIDER:-fake}",
        "BEDROCK_MODEL_ID": "${BEDROCK_MODEL_ID:-}",
        "AWS_REGION": "${AWS_REGION:-us-east-1}",
        "DATABASE_URL": "postgresql+psycopg://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/research",
        "STORAGE_BACKEND": "local",
        "STORAGE_PATH": "/app/local-data/uploads",
        "EMBEDDING_PROVIDER": "fake",
        "BOOTSTRAP_OWNER_EMAIL": "demo@example.test",
        "TAVILY_API_KEY": "${TAVILY_API_KEY:-}",
        "LANGSMITH_TRACING": "false",
        "LANGCHAIN_TRACING_V2": "false"
      },
      "volumes": [
        "application-data:/app/local-data"
      ],
      "command": [
        "uvicorn",
        "research_app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "ports": [
        "127.0.0.1:8000:8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"
        ],
        "interval": "10s",
        "timeout": "3s",
        "retries": 10
      }
    },
    "worker": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.backend",
        "target": "runtime",
        "args": {
          "INSTALL_EXTRAS": "${INSTALL_EXTRAS:-}"
        }
      },
      "environment": {
        "ENVIRONMENT": "local",
        "MODEL_PROVIDER": "${MODEL_PROVIDER:-fake}",
        "BEDROCK_MODEL_ID": "${BEDROCK_MODEL_ID:-}",
        "AWS_REGION": "${AWS_REGION:-us-east-1}",
        "DATABASE_URL": "postgresql+psycopg://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/research",
        "STORAGE_BACKEND": "local",
        "STORAGE_PATH": "/app/local-data/uploads",
        "EMBEDDING_PROVIDER": "fake",
        "BOOTSTRAP_OWNER_EMAIL": "demo@example.test",
        "TAVILY_API_KEY": "${TAVILY_API_KEY:-}",
        "LANGSMITH_TRACING": "false",
        "LANGCHAIN_TRACING_V2": "false"
      },
      "volumes": [
        "application-data:/app/local-data"
      ],
      "command": [
        "python",
        "-m",
        "research_app.worker"
      ],
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "web": {
      "build": {
        "context": "./web"
      },
      "environment": {
        "APP_ENV": "local",
        "AUTH_MODE": "local",
        "DEV_USER": "demo@example.test",
        "APP_BASE_URL": "http://localhost:3000",
        "API_INTERNAL_URL": "http://api:8000"
      },
      "ports": [
        "127.0.0.1:3000:3000"
      ],
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "postgres": {},
    "valkey": {},
    "clickhouse": {},
    "minio": {},
    "application-data": {}
  }
}
