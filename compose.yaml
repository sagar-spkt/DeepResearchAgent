{
  "name": "deepresearch-local",
  "services": {
    "postgres": {
      "image": "pgvector/pgvector:pg16",
      "environment": {
        "POSTGRES_USER": "research",
        "POSTGRES_PASSWORD": "${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}",
        "POSTGRES_DB": "research"
      },
      "ports": [
        "127.0.0.1:5432:5432"
      ],
      "volumes": [
        "postgres:/var/lib/postgresql/data",
        "./infra/database/local-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U research -d research"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "valkey": {
      "profiles": [
        "observability"
      ],
      "image": "valkey/valkey:8.0.2",
      "command": [
        "valkey-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${LOCAL_VALKEY_PASSWORD:?run scripts/setup_local_langfuse.py}"
      ],
      "volumes": [
        "valkey:/data"
      ]
    },
    "clickhouse": {
      "profiles": [
        "observability"
      ],
      "image": "clickhouse/clickhouse-server:24.12.3.47",
      "environment": {
        "CLICKHOUSE_DB": "default",
        "CLICKHOUSE_USER": "langfuse",
        "CLICKHOUSE_PASSWORD": "${LOCAL_CLICKHOUSE_PASSWORD:?run scripts/setup_local_langfuse.py}"
      },
      "volumes": [
        "clickhouse:/var/lib/clickhouse"
      ],
      "ulimits": {
        "nofile": {
          "soft": 262144,
          "hard": 262144
        }
      }
    },
    "seaweedfs": {
      "profiles": [
        "observability"
      ],
      "image": "chrislusf/seaweedfs:4.00",
      "command": [
        "server",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-dir=/data"
      ],
      "volumes": [
        "seaweedfs:/data",
        "./local-data/langfuse/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"
      ],
      "ports": [
        "127.0.0.1:8333:8333"
      ]
    },
    "langfuse": {
      "profiles": [
        "observability"
      ],
      "image": "langfuse/langfuse:3.133.0",
      "environment": {
        "DATABASE_URL": "postgresql://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/langfuse",
        "NEXTAUTH_URL": "http://localhost:3001",
        "NEXTAUTH_SECRET": "${LOCAL_LANGFUSE_AUTH_SECRET:?run scripts/setup_local_langfuse.py}",
        "SALT": "${LOCAL_LANGFUSE_SALT:?run scripts/setup_local_langfuse.py}",
        "ENCRYPTION_KEY": "${LOCAL_LANGFUSE_ENCRYPTION_KEY:?set 64 hex characters}",
        "CLICKHOUSE_URL": "http://clickhouse:8123",
        "CLICKHOUSE_MIGRATION_URL": "clickhouse://clickhouse:9000",
        "CLICKHOUSE_USER": "langfuse",
        "CLICKHOUSE_PASSWORD": "${LOCAL_CLICKHOUSE_PASSWORD:?run scripts/setup_local_langfuse.py}",
        "CLICKHOUSE_CLUSTER_ENABLED": "false",
        "REDIS_HOST": "valkey",
        "REDIS_PORT": "6379",
        "REDIS_AUTH": "${LOCAL_VALKEY_PASSWORD:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_S3_EVENT_UPLOAD_BUCKET": "langfuse",
        "LANGFUSE_S3_EVENT_UPLOAD_REGION": "us-east-1",
        "LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT": "http://seaweedfs:8333",
        "LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID": "${LOCAL_SEAWEEDFS_ACCESS_KEY:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY": "${LOCAL_SEAWEEDFS_SECRET_KEY:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE": "true",
        "TELEMETRY_ENABLED": "false",
        "AUTH_DISABLE_SIGNUP": "true",
        "LANGFUSE_INIT_ORG_ID": "${LANGFUSE_INIT_ORG_ID:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_ORG_NAME": "${LANGFUSE_INIT_ORG_NAME:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_PROJECT_ID": "${LANGFUSE_INIT_PROJECT_ID:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_PROJECT_NAME": "${LANGFUSE_INIT_PROJECT_NAME:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_PROJECT_PUBLIC_KEY": "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_PROJECT_SECRET_KEY": "${LANGFUSE_INIT_PROJECT_SECRET_KEY:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_USER_EMAIL": "${LANGFUSE_INIT_USER_EMAIL:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_USER_NAME": "${LANGFUSE_INIT_USER_NAME:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_INIT_USER_PASSWORD": "${LANGFUSE_INIT_USER_PASSWORD:?run scripts/setup_local_langfuse.py}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "valkey": {
          "condition": "service_started"
        },
        "clickhouse": {
          "condition": "service_started"
        },
        "seaweedfs": {
          "condition": "service_started"
        },
        "seaweedfs-init": {
          "condition": "service_completed_successfully"
        }
      },
      "ports": [
        "127.0.0.1:3001:3000"
      ]
    },
    "langfuse-worker": {
      "profiles": [
        "observability"
      ],
      "image": "langfuse/langfuse-worker:3.133.0",
      "environment": {
        "DATABASE_URL": "postgresql://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/langfuse",
        "NEXTAUTH_URL": "http://localhost:3001",
        "NEXTAUTH_SECRET": "${LOCAL_LANGFUSE_AUTH_SECRET:?run scripts/setup_local_langfuse.py}",
        "SALT": "${LOCAL_LANGFUSE_SALT:?run scripts/setup_local_langfuse.py}",
        "ENCRYPTION_KEY": "${LOCAL_LANGFUSE_ENCRYPTION_KEY:?set 64 hex characters}",
        "CLICKHOUSE_URL": "http://clickhouse:8123",
        "CLICKHOUSE_MIGRATION_URL": "clickhouse://clickhouse:9000",
        "CLICKHOUSE_USER": "langfuse",
        "CLICKHOUSE_PASSWORD": "${LOCAL_CLICKHOUSE_PASSWORD:?run scripts/setup_local_langfuse.py}",
        "CLICKHOUSE_CLUSTER_ENABLED": "false",
        "REDIS_HOST": "valkey",
        "REDIS_PORT": "6379",
        "REDIS_AUTH": "${LOCAL_VALKEY_PASSWORD:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_S3_EVENT_UPLOAD_BUCKET": "langfuse",
        "LANGFUSE_S3_EVENT_UPLOAD_REGION": "us-east-1",
        "LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT": "http://seaweedfs:8333",
        "LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID": "${LOCAL_SEAWEEDFS_ACCESS_KEY:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY": "${LOCAL_SEAWEEDFS_SECRET_KEY:?run scripts/setup_local_langfuse.py}",
        "LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE": "true",
        "TELEMETRY_ENABLED": "false",
        "AUTH_DISABLE_SIGNUP": "true"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "valkey": {
          "condition": "service_started"
        },
        "clickhouse": {
          "condition": "service_started"
        },
        "seaweedfs": {
          "condition": "service_started"
        },
        "seaweedfs-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "seaweedfs-init": {
      "profiles": [
        "observability"
      ],
      "image": "amazon/aws-cli:2.27.41",
      "entrypoint": [
        "/bin/sh",
        "-ec"
      ],
      "command": [
        "attempt=0; until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do attempt=$$((attempt+1)); test \"$$attempt\" -lt 60 || exit 1; sleep 2; done; aws --endpoint-url http://seaweedfs:8333 s3 mb s3://langfuse || aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket langfuse"
      ],
      "environment": {
        "AWS_ACCESS_KEY_ID": "${LOCAL_SEAWEEDFS_ACCESS_KEY:?run scripts/setup_local_langfuse.py}",
        "AWS_SECRET_ACCESS_KEY": "${LOCAL_SEAWEEDFS_SECRET_KEY:?run scripts/setup_local_langfuse.py}",
        "AWS_DEFAULT_REGION": "us-east-1"
      },
      "depends_on": [
        "seaweedfs"
      ]
    },
    "migrate": {
      "platform": "linux/amd64",
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.backend",
        "target": "runtime",
        "args": {
          "INSTALL_EXTRAS": "bedrock,embeddings"
        }
      },
      "environment": {
        "ENVIRONMENT": "local",
        "MODEL_PROVIDER": "bedrock",
        "BEDROCK_MODEL_ID": "${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}",
        "AWS_REGION": "${AWS_REGION:-us-east-1}",
        "DATABASE_URL": "postgresql+psycopg://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/research",
        "STORAGE_BACKEND": "local",
        "STORAGE_PATH": "/app/local-data/uploads",
        "EMBEDDING_PROVIDER": "sentence-transformers",
        "EMBEDDING_MODEL": "/models/bge-small-en-v1.5",
        "BOOTSTRAP_OWNER_EMAIL": "demo@example.test",
        "TAVILY_API_KEY": "${TAVILY_API_KEY:-}",
        "LANGSMITH_TRACING": "false",
        "LANGCHAIN_TRACING_V2": "false",
        "LANGFUSE_BASE_URL": "${LOCAL_LANGFUSE_CONTAINER_BASE_URL:-}",
        "LANGFUSE_PUBLIC_KEY": "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}",
        "LANGFUSE_SECRET_KEY": "${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}"
      },
      "volumes": [
        "application-data:/app/local-data",
        "./local-data/models/bge-small-en-v1.5:/models/bge-small-en-v1.5:ro"
      ],
      "command": [
        "python",
        "-m",
        "research_app.manage",
        "migrate"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "api": {
      "platform": "linux/amd64",
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.backend",
        "target": "runtime",
        "args": {
          "INSTALL_EXTRAS": "bedrock,embeddings"
        }
      },
      "environment": {
        "ENVIRONMENT": "local",
        "MODEL_PROVIDER": "bedrock",
        "BEDROCK_MODEL_ID": "${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}",
        "AWS_REGION": "${AWS_REGION:-us-east-1}",
        "DATABASE_URL": "postgresql+psycopg://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/research",
        "STORAGE_BACKEND": "local",
        "STORAGE_PATH": "/app/local-data/uploads",
        "EMBEDDING_PROVIDER": "sentence-transformers",
        "EMBEDDING_MODEL": "/models/bge-small-en-v1.5",
        "BOOTSTRAP_OWNER_EMAIL": "demo@example.test",
        "TAVILY_API_KEY": "${TAVILY_API_KEY:-}",
        "LANGSMITH_TRACING": "false",
        "LANGCHAIN_TRACING_V2": "false",
        "LANGFUSE_BASE_URL": "${LOCAL_LANGFUSE_CONTAINER_BASE_URL:-}",
        "LANGFUSE_PUBLIC_KEY": "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}",
        "LANGFUSE_SECRET_KEY": "${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}"
      },
      "volumes": [
        "application-data:/app/local-data",
        "./local-data/models/bge-small-en-v1.5:/models/bge-small-en-v1.5:ro"
      ],
      "command": [
        "uvicorn",
        "research_app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "ports": [
        "127.0.0.1:8000:8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"
        ],
        "interval": "10s",
        "timeout": "3s",
        "retries": 10
      }
    },
    "worker": {
      "platform": "linux/amd64",
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.backend",
        "target": "runtime",
        "args": {
          "INSTALL_EXTRAS": "bedrock,embeddings"
        }
      },
      "environment": {
        "ENVIRONMENT": "local",
        "MODEL_PROVIDER": "bedrock",
        "BEDROCK_MODEL_ID": "${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}",
        "AWS_REGION": "${AWS_REGION:-us-east-1}",
        "DATABASE_URL": "postgresql+psycopg://research:${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}@postgres:5432/research",
        "STORAGE_BACKEND": "local",
        "STORAGE_PATH": "/app/local-data/uploads",
        "EMBEDDING_PROVIDER": "sentence-transformers",
        "EMBEDDING_MODEL": "/models/bge-small-en-v1.5",
        "BOOTSTRAP_OWNER_EMAIL": "demo@example.test",
        "TAVILY_API_KEY": "${TAVILY_API_KEY:-}",
        "LANGSMITH_TRACING": "false",
        "LANGCHAIN_TRACING_V2": "false",
        "LANGFUSE_BASE_URL": "${LOCAL_LANGFUSE_CONTAINER_BASE_URL:-}",
        "LANGFUSE_PUBLIC_KEY": "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}",
        "LANGFUSE_SECRET_KEY": "${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}"
      },
      "volumes": [
        "application-data:/app/local-data",
        "./local-data/models/bge-small-en-v1.5:/models/bge-small-en-v1.5:ro"
      ],
      "command": [
        "python",
        "-m",
        "research_app.worker"
      ],
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "web": {
      "build": {
        "context": "./web"
      },
      "environment": {
        "APP_ENV": "local",
        "AUTH_MODE": "local",
        "DEV_USER": "demo@example.test",
        "APP_BASE_URL": "http://localhost:3000",
        "API_INTERNAL_URL": "http://api:8000"
      },
      "ports": [
        "127.0.0.1:3000:3000"
      ],
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "postgres": {},
    "valkey": {},
    "clickhouse": {},
    "seaweedfs": {},
    "application-data": {}
  }
}
