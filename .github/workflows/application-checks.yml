{
  "name": "Application checks",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "backend": {
      "name": "Backend behavior",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Create isolated Python tool environment",
          "run": "python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'\npython3 -m venv .uv-tool\n.uv-tool/bin/python -m pip install --disable-pip-version-check uv==0.12.5\n.uv-tool/bin/uv sync --locked --group dev --group build --extra bedrock"
        },
        {
          "name": "Lint and types",
          "run": ".venv/bin/ruff check backend scripts tests\n.venv/bin/mypy backend/research_app --no-incremental"
        },
        {
          "name": "Backend and long-conversation regression tests",
          "run": ".venv/bin/python -m pytest backend/tests -q"
        },
        {
          "name": "Offline research harness",
          "run": ".venv/bin/python scripts/run_evals.py --output local-data/evals/offline.json"
        }
      ]
    },
    "frontend": {
      "name": "Frontend behavior",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22"
          }
        },
        {
          "run": "node --test web/tests/*.test.mjs\nnpm --prefix web run check"
        }
      ]
    },
    "frontend-build": {
      "name": "Frontend reproducible build",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Require resolved dependency lock",
          "run": "test -f web/package-lock.json || { echo \"Build blocked: resolve and review web/package-lock.json in a registry-enabled environment\"; exit 1; }"
        },
        {
          "run": "npm --prefix web ci --ignore-scripts\nnpm --prefix web run build"
        }
      ]
    },
    "container-security": {
      "name": "Container scans and SBOMs",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install pinned Trivy",
          "uses": "aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567",
          "with": {
            "version": "v0.76.2"
          }
        },
        {
          "name": "Build immutable-input application images",
          "run": "mkdir -p local-data/ci-artifacts\ndocker build --platform linux/amd64 --target runtime --tag deepresearch-backend:ci --file Dockerfile.backend .\ndocker build --platform linux/amd64 --target embeddings --build-arg EMBEDDING_REVISION=5c38ec7c405ec4b44b94cc5a9bb96e735b38267a --tag deepresearch-embeddings:ci --file Dockerfile.backend .\ndocker build --platform linux/amd64 --tag deepresearch-web:ci --file web/Dockerfile web"
        },
        {
          "name": "Verify the embedding model card in the offline image",
          "run": "docker run --rm --network none --entrypoint python deepresearch-embeddings:ci -c \"from pathlib import Path; p=Path('/opt/models/bge-small-en-v1.5/README.md'); assert p.is_file() and p.stat().st_size > 0\""
        },
        {
          "name": "Pull pinned Langfuse console proxy image",
          "run": "docker pull ghcr.io/nginx/nginx-unprivileged:1.30.6-alpine3.24@sha256:6b0610b60dff09248d642643a29393543a92eb355b00bbd1d12c7af562ef94c4"
        },
        {
          "name": "Scan and create SBOMs",
          "run": "set -eu\nfor image in deepresearch-backend:ci deepresearch-embeddings:ci deepresearch-web:ci; do\n  name=${image%:ci}\n  trivy image --scanners vuln,license --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output \"local-data/ci-artifacts/${name}-trivy.json\" \"$image\"\n  trivy image --format cyclonedx --output \"local-data/ci-artifacts/${name}-sbom.cdx.json\" \"$image\"\n  trivy image --scanners vuln --severity CRITICAL --exit-code 1 \"$image\"\n  trivy image --scanners vuln --ignore-unfixed --severity HIGH --exit-code 1 \"$image\"\ndone\nconsole_image=ghcr.io/nginx/nginx-unprivileged:1.30.6-alpine3.24@sha256:6b0610b60dff09248d642643a29393543a92eb355b00bbd1d12c7af562ef94c4\ntrivy image --scanners vuln,license --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output local-data/ci-artifacts/langfuse-console-nginx-trivy.json \"$console_image\"\ntrivy image --format cyclonedx --output local-data/ci-artifacts/langfuse-console-nginx-sbom.cdx.json \"$console_image\"\ntrivy image --scanners vuln --severity CRITICAL --exit-code 1 \"$console_image\"\ntrivy image --scanners vuln --ignore-unfixed --severity HIGH --exit-code 1 \"$console_image\""
        },
        {
          "name": "Upload image scan reports and SBOMs",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "container-security-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "local-data/ci-artifacts/",
            "if-no-files-found": "warn",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
