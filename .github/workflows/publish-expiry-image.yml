{
  "name": "Publish staging expiry runner image",
  "on": {
    "push": {
      "branches": ["main"],
      "paths": [
        ".github/workflows/publish-expiry-image.yml",
        "infra/expiry/runner/**",
        "infra/foundation/main.tf",
        "infra/github-oidc/**",
        "uv.lock"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "confirmation": {
          "description": "Type PUBLISH STAGING EXPIRY IMAGE",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "checks": "read"
  },
  "concurrency": {
    "group": "deepresearch-expiry-image-publish",
    "cancel-in-progress": false
  },
  "env": {
    "AWS_REGION": "us-east-1",
    "AWS_ROLE_ARN": "arn:aws:iam::088759500358:role/deepresearch-staging-expiry-image-publisher",
    "ECR_EXPIRY_RUNNER": "deepresearch-staging/expiry-runner"
  },
  "jobs": {
    "required-checks": {
      "name": "Wait for required checks on this commit",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Require manual confirmation when dispatched",
          "if": "github.event_name == 'workflow_dispatch'",
          "env": {
            "CONFIRMATION": "${{ inputs.confirmation }}"
          },
          "run": "test \"$CONFIRMATION\" = 'PUBLISH STAGING EXPIRY IMAGE'"
        },
        {
          "name": "Wait for every required CI context to succeed for this commit",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPOSITORY": "${{ github.repository }}",
            "COMMIT_SHA": "${{ github.sha }}"
          },
          "run": "python3 - <<'PY'\nimport json\nimport os\nimport subprocess\nimport sys\nimport time\nrequired = {\n    \"Backend behavior\", \"Frontend behavior\", \"Frontend reproducible build\",\n    \"Container scans and SBOMs\", \"Terraform format and validate\",\n    \"Helm schema and render checks\", \"Repository checks\",\n}\ndeadline = time.monotonic() + 25 * 60\nurl = f\"repos/{os.environ['GH_REPOSITORY']}/commits/{os.environ['COMMIT_SHA']}/check-runs?per_page=100\"\nwhile time.monotonic() < deadline:\n    result = subprocess.run([\"gh\", \"api\", url], check=True, capture_output=True, text=True)\n    checks = json.loads(result.stdout)[\"check_runs\"]\n    latest = {}\n    for check in checks:\n        name = check[\"name\"]\n        if name in required:\n            stamp = check.get(\"started_at\") or check[\"created_at\"]\n            if name not in latest or stamp > latest[name][0]:\n                latest[name] = (stamp, check[\"status\"], check[\"conclusion\"])\n    failed = sorted(n for n, (_, status, conclusion) in latest.items() if status == \"completed\" and conclusion != \"success\")\n    if failed:\n        sys.exit(\"Required checks failed: \" + \", \".join(failed))\n    if required <= latest.keys() and all(latest[n][1:] == (\"completed\", \"success\") for n in required):\n        print(\"All seven required checks passed for this commit.\")\n        break\n    time.sleep(15)\nelse:\n    sys.exit(\"Timed out waiting for the required checks.\")\nPY"
        }
      ]
    },
    "publish": {
      "name": "Build and publish immutable expiry runner image",
      "needs": "required-checks",
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "environment": "staging",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": { "persist-credentials": false }
        },
        {
          "name": "Configure exact expiry image publisher role with OIDC",
          "uses": "aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df",
          "with": {
            "role-to-assume": "${{ env.AWS_ROLE_ARN }}",
            "role-session-name": "expiry-image-${{ github.run_id }}-${{ github.run_attempt }}",
            "aws-region": "${{ env.AWS_REGION }}"
          }
        },
        {
          "name": "Verify deployment account",
          "run": "test \"$(aws sts get-caller-identity --query Account --output text)\" = 088759500358"
        },
        {
          "name": "Log in to the staging ECR repository",
          "id": "ecr",
          "uses": "aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd"
        },
        {
          "uses": "docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2"
        },
        {
          "name": "Build and publish immutable expiry runner image",
          "id": "image",
          "uses": "docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83",
          "with": {
            "context": "infra/expiry/runner",
            "file": "infra/expiry/runner/Dockerfile",
            "platforms": "linux/amd64",
            "push": true,
            "provenance": true,
            "sbom": true,
            "tags": "${{ steps.ecr.outputs.registry }}/${{ env.ECR_EXPIRY_RUNNER }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "name": "Record immutable image digest",
          "env": {
            "IMAGE_DIGEST": "${{ steps.image.outputs.digest }}",
            "ECR_REGISTRY": "${{ steps.ecr.outputs.registry }}"
          },
          "run": "set -eu\nimage=\"$ECR_REGISTRY/$ECR_EXPIRY_RUNNER@$IMAGE_DIGEST\"\necho \"Published expiry runner image: $image\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"Set runner_image_digest to this immutable value: $image\" >> \"$GITHUB_STEP_SUMMARY\""
        }
      ]
    }
  }
}
