{
  "name": "Deploy staging",
  "permissions": {
    "contents": "read",
    "checks": "read"
  },
  "concurrency": {
    "group": "deepresearch-aws-lifecycle",
    "cancel-in-progress": false
  },
  "env": {
    "AWS_REGION": "us-east-1",
    "AWS_ROLE_ARN": "arn:aws:iam::088759500358:role/deepresearch-staging-github-oidc",
    "ECR_BACKEND": "deepresearch-staging/backend",
    "ECR_WEB": "deepresearch-staging/web",
    "STAGING_HOST": "staging.research.spktsagar.com",
    "VLLM_IMAGE": "vllm/vllm-openai@sha256:20fdb089454afbb324efa4110a2c025ff7b27cc1a086e07aa580b18df8ad1ce1",
    "QWEN3_REVISION": "b968826d9c46dd6066d109eabc6255188de91218",
    "EMBEDDING_REVISION": "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
  },
  "jobs": {
    "required-checks": {
      "name": "Wait for required checks on this commit",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Require manual authorization when dispatched",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "STAGING_CONFIRMATION": "${{ inputs.staging_confirmation }}",
            "DEPLOYMENT_MODE": "${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'public' }}"
          },
          "run": "set -eu\nif [ \"$EVENT_NAME\" = workflow_dispatch ]; then\n  case \"$DEPLOYMENT_MODE\" in\n    public)\n      expected=\"I AUTHORIZE STAGING DEPLOYMENT\"\n      ;;\n    closed-rehearsal)\n      expected=\"I AUTHORIZE CLOSED STAGING REHEARSAL\"\n      ;;\n    *)\n      echo \"Unsupported staging deployment mode.\" >&2\n      exit 1\n      ;;\n  esac\n  if [ \"$STAGING_CONFIRMATION\" != \"$expected\" ]; then\n    echo \"Manual staging deployment requires the exact confirmation phrase for its selected mode.\" >&2\n    exit 1\n  fi\nfi\necho \"Staging deployment actor: $GITHUB_ACTOR; commit: $GITHUB_SHA; mode: $DEPLOYMENT_MODE\"\n"
        },
        {
          "name": "Wait for every required CI context to succeed for this commit",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPOSITORY": "${{ github.repository }}",
            "COMMIT_SHA": "${{ github.sha }}"
          },
          "run": "python3 - <<'PY'\nimport json\nimport os\nimport subprocess\nimport sys\nimport time\n\nrequired = {\n    \"Backend behavior\",\n    \"Frontend behavior\",\n    \"Frontend reproducible build\",\n    \"Container scans and SBOMs\",\n    \"Terraform format and validate\",\n    \"Helm schema and render checks\",\n    \"Repository checks\",\n}\ndeadline = time.monotonic() + 25 * 60\nurl = f\"repos/{os.environ['GH_REPOSITORY']}/commits/{os.environ['COMMIT_SHA']}/check-runs?per_page=100\"\nwhile time.monotonic() < deadline:\n    result = subprocess.run(\n        [\"gh\", \"api\", url],\n        check=True,\n        capture_output=True,\n        text=True,\n        env=os.environ.copy(),\n    )\n    checks = json.loads(result.stdout)[\"check_runs\"]\n    latest = {}\n    for check in checks:\n        name = check[\"name\"]\n        if name in required:\n            timestamp = check.get(\"started_at\") or check[\"created_at\"]\n            if name not in latest or timestamp > latest[name][\"timestamp\"]:\n                latest[name] = {\n                    \"timestamp\": timestamp,\n                    \"status\": check[\"status\"],\n                    \"conclusion\": check[\"conclusion\"],\n                }\n    failed = sorted(\n        name for name, value in latest.items()\n        if value[\"status\"] == \"completed\" and value[\"conclusion\"] != \"success\"\n    )\n    if failed:\n        print(\"Required checks failed: \" + \", \".join(failed), file=sys.stderr)\n        raise SystemExit(1)\n    if required.issubset(latest) and all(\n        latest[name][\"status\"] == \"completed\"\n        and latest[name][\"conclusion\"] == \"success\"\n        for name in required\n    ):\n        print(\"All seven required checks succeeded for this exact commit.\")\n        break\n    pending = sorted(required - set(latest))\n    print(\"Waiting for required checks: \" + \", \".join(pending or sorted(required)))\n    time.sleep(15)\nelse:\n    raise SystemExit(\"Timed out before all seven required checks succeeded.\")\nPY\n"
        }
      ]
    },
    "recovery-gate": {
      "name": "Require accepted staging recovery rehearsal",
      "needs": "required-checks",
      "runs-on": "ubuntu-24.04",
      "environment": "staging",
      "outputs": {
        "accepted": "${{ steps.gate.outputs.accepted }}"
      },
      "steps": [
        {
          "name": "Report the recovery gate",
          "id": "gate",
          "env": {
            "RECOVERY_ACCEPTED": "${{ vars.STAGING_RECOVERY_ACCEPTED }}",
            "NETWORK_READY": "${{ vars.STAGING_EKS_NETWORK_READY }}",
            "DEPLOYMENT_MODE": "${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'public' }}",
            "EVENT_NAME": "${{ github.event_name }}",
            "GIT_REF": "${{ github.ref }}",
            "ADMISSION_READY": "${{ vars.STAGING_LIFECYCLE_ADMISSION_READY }}",
            "EXPIRY_READY": "${{ vars.STAGING_EXPIRY_READY }}",
            "ARTIFACTS_READY": "${{ vars.STAGING_EXPIRY_ARTIFACTS_READY }}",
            "CLEANUP_READY": "${{ vars.STAGING_BOOTSTRAP_CLEANUP_READY }}"
          },
          "run": "set -eu\nif [ \"$DEPLOYMENT_MODE\" = public ]; then\n  if [ \"$RECOVERY_ACCEPTED\" != \"true\" ]; then\n    echo \"accepted=false\" >> \"$GITHUB_OUTPUT\"\n    echo \"Public staging skipped: backup/restore rehearsal has not been completed and accepted.\" >> \"$GITHUB_STEP_SUMMARY\"\n  elif [ \"$NETWORK_READY\" != \"true\" ]; then\n    echo \"accepted=false\" >> \"$GITHUB_OUTPUT\"\n    echo \"Public staging skipped: an in-VPC EKS deployment runner has not been installed and verified.\" >> \"$GITHUB_STEP_SUMMARY\"\n  else\n    echo \"accepted=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"Staging recovery and in-VPC runner gates are accepted.\" >> \"$GITHUB_STEP_SUMMARY\"\n  fi\nelif [ \"$DEPLOYMENT_MODE\" = closed-rehearsal ]; then\n  if [ \"$EVENT_NAME\" != workflow_dispatch ] || [ \"$GIT_REF\" != refs/heads/main ]; then\n    echo \"accepted=false\" >> \"$GITHUB_OUTPUT\"\n    echo \"Closed rehearsal requires a manual dispatch on main.\" >> \"$GITHUB_STEP_SUMMARY\"\n    exit 0\n  fi\n  missing=\"\"\n  for item in \"lifecycle admission:$ADMISSION_READY\" \"expiry installed:$EXPIRY_READY\" \"immutable expiry artifacts and permissions:$ARTIFACTS_READY\" \"first-provision cleanup:$CLEANUP_READY\" \"in-VPC EKS runner:$NETWORK_READY\"; do\n    name=${item%%:*}\n    value=${item#*:}\n    if [ \"$value\" != true ]; then\n      missing=\"$missing\n- $name\"\n    fi\n  done\n  if [ -n \"$missing\" ]; then\n    echo \"accepted=false\" >> \"$GITHUB_OUTPUT\"\n    {\n      echo \"Closed rehearsal skipped: required pre-writer controls are not verified.\"\n      echo\n      printf '%b\\n' \"$missing\"\n    } >> \"$GITHUB_STEP_SUMMARY\"\n  else\n    echo \"accepted=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"Closed rehearsal pre-writer controls are verified. Public recovery acceptance remains false until a real backup/restore rehearsal passes.\" >> \"$GITHUB_STEP_SUMMARY\"\n  fi\nelse\n  echo \"accepted=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"Unknown deployment mode; no deployment will run.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
        }
      ]
    },
    "deploy": {
      "name": "Build and deploy staging",
      "needs": [
        "required-checks",
        "recovery-gate"
      ],
      "if": "github.ref == 'refs/heads/main' && needs.recovery-gate.outputs.accepted == 'true'",
      "runs-on": [
        "self-hosted",
        "linux",
        "staging-vpc"
      ],
      "environment": "staging",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Configure staging AWS credentials with OIDC",
          "uses": "aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df",
          "with": {
            "role-to-assume": "${{ env.AWS_ROLE_ARN }}",
            "role-session-name": "staging-${{ github.run_id }}-${{ github.run_attempt }}",
            "aws-region": "${{ env.AWS_REGION }}"
          }
        },
        {
          "name": "Verify deployment account",
          "run": "set -eu\ntest \"$(aws sts get-caller-identity --query Account --output text)\" = \"088759500358\"\n"
        },
        {
          "name": "Acquire and renew the shared staging lifecycle lease",
          "run": "set -eu\nowner_file=\"$RUNNER_TEMP/staging-lifecycle-owner\"\npython3 scripts/staging_lifecycle_lease.py acquire --owner-file \"$owner_file\"\nnohup python3 scripts/staging_lifecycle_lease.py heartbeat --owner-file \"$owner_file\" --interval 30 </dev/null >/dev/null 2>&1 &\necho \"$!\" > \"$RUNNER_TEMP/staging-lifecycle-heartbeat-pid\"\necho \"STAGING_LIFECYCLE_HEARTBEAT_PID=$!\" >> \"$GITHUB_ENV\"\necho \"STAGING_LIFECYCLE_OWNER_FILE=$owner_file\" >> \"$GITHUB_ENV\"\necho \"The global staging lifecycle lease is held for this deployment.\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        },
        {
          "name": "Log in to the staging ECR repositories",
          "id": "ecr",
          "uses": "aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd"
        },
        {
          "uses": "docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2"
        },
        {
          "name": "Build and publish immutable backend image",
          "id": "backend",
          "uses": "docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83",
          "with": {
            "context": ".",
            "file": "Dockerfile.backend",
            "target": "embeddings",
            "platforms": "linux/amd64",
            "push": true,
            "build-args": "EMBEDDING_REVISION=${{ env.EMBEDDING_REVISION }}",
            "tags": "${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:run-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "name": "Build and publish immutable web image",
          "id": "web",
          "uses": "docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83",
          "with": {
            "context": "web",
            "file": "web/Dockerfile",
            "platforms": "linux/amd64",
            "push": true,
            "tags": "${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB }}:run-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "name": "Install Helm",
          "uses": "azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4",
          "with": {
            "version": "v3.22.1"
          }
        },
        {
          "name": "Install kubectl",
          "uses": "Azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f",
          "with": {
            "version": "v1.37.1"
          }
        },
        {
          "name": "Prepare private deployment secrets and database endpoint",
          "env": {
            "APPLICATION_SECRET_ARN": "arn:aws:secretsmanager:us-east-1:088759500358:secret:deepresearch-staging/application-vk3oyF",
            "WEB_SECRET_ARN": "arn:aws:secretsmanager:us-east-1:088759500358:secret:deepresearch-staging/web-ccuabP",
            "VLLM_SECRET_ARN": "arn:aws:secretsmanager:us-east-1:088759500358:secret:deepresearch-staging/vllm-oUITvX"
          },
          "run": "set -euo pipefail\numask 077\nrm -rf \"$RUNNER_TEMP/staging-secrets\"\nmkdir -m 700 \"$RUNNER_TEMP/staging-secrets\"\naws secretsmanager get-secret-value --secret-id \"$APPLICATION_SECRET_ARN\" --query SecretString --output text > \"$RUNNER_TEMP/staging-secrets/application.json\"\naws secretsmanager get-secret-value --secret-id \"$WEB_SECRET_ARN\" --query SecretString --output text > \"$RUNNER_TEMP/staging-secrets/web.json\"\naws secretsmanager get-secret-value --secret-id \"$VLLM_SECRET_ARN\" --query SecretString --output text > \"$RUNNER_TEMP/staging-secrets/vllm.json\"\ndatabase=$(aws rds describe-db-instances --db-instance-identifier deepresearch-staging --query 'DBInstances[0].[Endpoint.Address,Endpoint.Port,MasterUserSecret.SecretArn]' --output text)\nread -r database_host database_port rds_secret_arn <<< \"$database\"\naws secretsmanager get-secret-value --secret-id \"$rds_secret_arn\" --query SecretString --output text > \"$RUNNER_TEMP/staging-secrets/rds.json\"\npython3 scripts/materialize_staging_secrets.py \\\n  --application-json \"$RUNNER_TEMP/staging-secrets/application.json\" \\\n  --web-json \"$RUNNER_TEMP/staging-secrets/web.json\" \\\n  --vllm-json \"$RUNNER_TEMP/staging-secrets/vllm.json\" \\\n  --rds-json \"$RUNNER_TEMP/staging-secrets/rds.json\" \\\n  --database-host \"$database_host\" \\\n  --database-port \"$database_port\" \\\n  --output-dir \"$RUNNER_TEMP/staging-secrets/env\"\necho \"DATABASE_HOST=$database_host\" >> \"$GITHUB_ENV\"\necho \"DATABASE_PORT=$database_port\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Bootstrap the database and deploy the reviewed staging chart",
          "env": {
            "BACKEND_IMAGE": "${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND }}@${{ steps.backend.outputs.digest }}",
            "WEB_IMAGE": "${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB }}@${{ steps.web.outputs.digest }}",
            "CERTIFICATE_ARN": "${{ vars.STAGING_CERTIFICATE_ARN }}",
            "BOOTSTRAP_SECRET_NAME": "research-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}",
            "BOOTSTRAP_JOB_NAME": "research-db-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}",
            "DEPLOYMENT_MODE": "${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'public' }}"
          },
          "run": "set -euo pipefail\nlease_guard() {\n  python3 scripts/staging_lifecycle_lease.py assert --owner-file \"$STAGING_LIFECYCLE_OWNER_FILE\"\n  \"$@\" &\n  operation_pid=$!\n  while kill -0 \"$operation_pid\" 2>/dev/null; do\n    now=$(date +%s)\n    heartbeat_file=\"${STAGING_LIFECYCLE_OWNER_FILE}.heartbeat\"\n    if [ -f \"${STAGING_LIFECYCLE_OWNER_FILE}.lost\" ] || [ ! -f \"$heartbeat_file\" ] || [ \"$((now - $(cat \"$heartbeat_file\")))\" -gt 90 ]; then\n      kill \"$operation_pid\" 2>/dev/null || true\n      wait \"$operation_pid\" 2>/dev/null || true\n      echo \"Staging lifecycle lease renewal was lost; deployment operation stopped.\" >&2\n      return 1\n    fi\n    sleep 5\n  done\n  wait \"$operation_pid\"\n  python3 scripts/staging_lifecycle_lease.py assert --owner-file \"$STAGING_LIFECYCLE_OWNER_FILE\"\n}\napply_secret() {\n  name=\"$1\"\n  source_file=\"$2\"\n  manifest=\"$RUNNER_TEMP/research-$name.yaml\"\n  kubectl -n research create secret generic \"research-$name\" --from-env-file \"$source_file\" --dry-run=client -o yaml > \"$manifest\"\n  lease_guard kubectl -n research apply -f \"$manifest\"\n}\nif [ \"$DEPLOYMENT_MODE\" = public ] && [ -z \"$CERTIFICATE_ARN\" ]; then\n  echo \"The staging GitHub environment must define STAGING_CERTIFICATE_ARN for public deployment.\" >&2\n  exit 1\nfi\naws eks update-kubeconfig --region \"$AWS_REGION\" --name deepresearch-staging --alias deepresearch-staging\npython3 scripts/staging_lifecycle_lease.py assert --owner-file \"$STAGING_LIFECYCLE_OWNER_FILE\"\nif ! kubectl get namespace research >/dev/null 2>&1; then\n  echo \"The staging namespace must be created by the reviewed cluster bootstrap before deployment.\" >&2\n  exit 1\nfi\ncleanup_bootstrap() {\n  lease_guard kubectl -n research delete job \"$BOOTSTRAP_JOB_NAME\" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true\n  # Always remove this one short-lived secret, even if lease renewal failed.\n  kubectl -n research delete secret \"$BOOTSTRAP_SECRET_NAME\" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true\n  rm -rf \"$RUNNER_TEMP/staging-secrets\"\n}\ntrap cleanup_bootstrap EXIT\nkubectl auth can-i create deployments --namespace research | grep -Fx yes\napply_secret application \"$RUNNER_TEMP/staging-secrets/env/application.env\"\napply_secret web-env \"$RUNNER_TEMP/staging-secrets/env/web.env\"\napply_secret vllm \"$RUNNER_TEMP/staging-secrets/env/vllm.env\"\nkubectl -n research create secret generic \"$BOOTSTRAP_SECRET_NAME\" --from-env-file \"$RUNNER_TEMP/staging-secrets/env/bootstrap.env\" --dry-run=client -o yaml > \"$RUNNER_TEMP/$BOOTSTRAP_SECRET_NAME.yaml\"\nlease_guard kubectl -n research apply -f \"$RUNNER_TEMP/$BOOTSTRAP_SECRET_NAME.yaml\"\nlease_guard kubectl -n research delete job \"$BOOTSTRAP_JOB_NAME\" --ignore-not-found=true --wait=true\ncat > \"$RUNNER_TEMP/research-db-bootstrap.yaml\" <<EOF\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name: $BOOTSTRAP_JOB_NAME\n  namespace: research\nspec:\n  backoffLimit: 0\n  activeDeadlineSeconds: 300\n  template:\n    spec:\n      restartPolicy: Never\n      automountServiceAccountToken: false\n      containers:\n        - name: bootstrap\n          image: $BACKEND_IMAGE\n          command: [\"python\", \"-m\", \"research_app.bootstrap_db\"]\n          envFrom:\n            - secretRef:\n                name: $BOOTSTRAP_SECRET_NAME\nEOF\nlease_guard kubectl apply -f \"$RUNNER_TEMP/research-db-bootstrap.yaml\"\nlease_guard kubectl -n research wait --for=condition=complete \"job/$BOOTSTRAP_JOB_NAME\" --timeout=5m\nlease_guard kubectl -n research delete job \"$BOOTSTRAP_JOB_NAME\" --wait=true\nlease_guard kubectl -n research delete secret \"$BOOTSTRAP_SECRET_NAME\" --wait=true\ntrap - EXIT\nrm -rf \"$RUNNER_TEMP/staging-secrets\"\nhelm_args=(\n  --namespace research\n  --wait --atomic --timeout 40m\n  --set environment=staging\n  --set-string backendImage=\"$BACKEND_IMAGE\"\n  --set-string webImage=\"$WEB_IMAGE\"\n)\nif [ \"$DEPLOYMENT_MODE\" = public ]; then\n  helm_args+=(\n    --set vllm.enabled=true\n    --set-string vllm.image=\"$VLLM_IMAGE\"\n    --set-string vllm.revision=\"$QWEN3_REVISION\"\n    --set vllm.maxModelLen=16384\n    --set ingress.enabled=true\n    --set-string ingress.host=\"$STAGING_HOST\"\n    --set-string ingress.certificateArn=\"$CERTIFICATE_ARN\"\n  )\nelif [ \"$DEPLOYMENT_MODE\" = closed-rehearsal ]; then\n  helm_args+=(--set vllm.enabled=false --set ingress.enabled=false)\nelse\n  echo \"Unknown staging deployment mode.\" >&2\n  exit 1\nfi\nlease_guard helm upgrade --install research ./helm/research \"${helm_args[@]}\"\nlease_guard kubectl -n research rollout status deployment/research-api --timeout=5m\nlease_guard kubectl -n research rollout status deployment/research-worker --timeout=5m\nlease_guard kubectl -n research rollout status deployment/research-web --timeout=5m\nif [ \"$DEPLOYMENT_MODE\" = public ]; then\n  lease_guard python3 scripts/staging_dns_alias.py\nfi\n"
        },
        {
          "name": "Report immutable release digests",
          "env": {
            "BACKEND_DIGEST": "${{ steps.backend.outputs.digest }}",
            "WEB_DIGEST": "${{ steps.web.outputs.digest }}",
            "DEPLOYMENT_MODE": "${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'public' }}"
          },
          "run": "{\n  echo \"### Staging deployment\"\n  echo\n  echo \"Commit: `$GITHUB_SHA`\"\n  echo \"Backend: `$BACKEND_DIGEST`\"\n  echo \"Web: `$WEB_DIGEST`\"\n  if [ \"$DEPLOYMENT_MODE\" = public ]; then\n    echo \"Mode: public\"\n    echo \"Environment: https://$STAGING_HOST\"\n  else\n    echo \"Mode: closed recovery rehearsal\"\n    echo \"Ingress and vLLM are disabled; no public URL was created.\"\n    echo \"This deployment does not establish backup or restore acceptance.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
        },
        {
          "name": "Stop renewal and allow the lifecycle lease to expire",
          "if": "always()",
          "run": "set -eu\nif [ -f \"$RUNNER_TEMP/staging-lifecycle-heartbeat-pid\" ]; then\n  kill \"$(cat \"$RUNNER_TEMP/staging-lifecycle-heartbeat-pid\")\" 2>/dev/null || true\nfi\necho \"The lease will expire automatically within two minutes; the deploy role cannot delete the shared lock.\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        },
        {
          "name": "Remove temporary staging credentials from the runner",
          "if": "always()",
          "run": "rm -rf \"$RUNNER_TEMP/staging-secrets\" \"$RUNNER_TEMP/research-application.yaml\" \"$RUNNER_TEMP/research-web-env.yaml\" \"$RUNNER_TEMP/research-vllm.yaml\" \"$RUNNER_TEMP/$BOOTSTRAP_SECRET_NAME.yaml\" \"$RUNNER_TEMP/research-db-bootstrap.yaml\" \"$RUNNER_TEMP/staging-lifecycle-owner\" \"$RUNNER_TEMP/staging-lifecycle-owner.heartbeat\" \"$RUNNER_TEMP/staging-lifecycle-owner.lost\" \"$RUNNER_TEMP/staging-lifecycle-heartbeat-pid\"\n",
          "env": {
            "BOOTSTRAP_SECRET_NAME": "research-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        }
      ]
    }
  },
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "deployment_mode": {
          "description": "Choose public staging or an internal-only, no-vLLM rehearsal deployment.",
          "type": "choice",
          "options": [
            "public",
            "closed-rehearsal"
          ],
          "required": true,
          "default": "public"
        },
        "environment": {
          "type": "choice",
          "options": [
            "staging"
          ],
          "required": true,
          "default": "staging"
        },
        "staging_confirmation": {
          "description": "For public deployment enter I AUTHORIZE STAGING DEPLOYMENT; for closed rehearsal enter I AUTHORIZE CLOSED STAGING REHEARSAL.",
          "type": "string",
          "required": false
        }
      }
    }
  }
}
