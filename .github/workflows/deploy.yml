{
  "name": "Deploy",
  "run-name": "Deploy ${{ inputs.target }} @ ${{ github.sha }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "target": {
          "description": "Production is deployed only after staging deploys and passes its smoke tests in the same run.",
          "type": "choice",
          "options": [
            "staging",
            "staging-then-production"
          ],
          "default": "staging",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "aws-environments",
    "cancel-in-progress": false
  },
  "env": {
    "AWS_REGION": "us-east-1",
    "TF_STATE_BUCKET": "ra-088759500358-terraform-state"
  },
  "jobs": {
    "staging": {
      "name": "Provision and deploy staging",
      "runs-on": "ubuntu-24.04",
      "environment": {
        "name": "staging"
      },
      "timeout-minutes": 120,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "if": "github.ref == 'refs/heads/main'",
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-aws",
          "with": {
            "environment": "staging"
          }
        },
        {
          "name": "Provision infrastructure, deploy and smoke-test staging",
          "env": {
            "BOOTSTRAP_OWNER_EMAIL": "${{ vars.BOOTSTRAP_OWNER_EMAIL }}",
            "TAVILY_API_KEY": "${{ secrets.TAVILY_API_KEY }}"
          },
          "run": "scripts/deploy.sh staging"
        }
      ]
    },
    "production": {
      "name": "Provision and deploy production",
      "runs-on": "ubuntu-24.04",
      "environment": {
        "name": "production"
      },
      "timeout-minutes": 120,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "needs": "staging",
      "if": "github.ref == 'refs/heads/main' && inputs.target == 'staging-then-production'",
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-aws",
          "with": {
            "environment": "production"
          }
        },
        {
          "name": "Provision infrastructure, deploy and smoke-test production",
          "env": {
            "BOOTSTRAP_OWNER_EMAIL": "${{ vars.BOOTSTRAP_OWNER_EMAIL }}",
            "TAVILY_API_KEY": "${{ secrets.TAVILY_API_KEY }}"
          },
          "run": "scripts/deploy.sh production"
        }
      ]
    }
  }
}
