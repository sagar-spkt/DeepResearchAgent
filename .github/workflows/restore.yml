{
  "name": "Prepare restore",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "choice",
          "options": [
            "staging",
            "production"
          ],
          "required": true,
          "default": "staging"
        },
        "confirmation": {
          "description": "For staging: I AUTHORIZE STAGING RESTORE. For production: I AUTHORIZE PRODUCTION RESTORE.",
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "deepresearch-aws-lifecycle",
    "cancel-in-progress": false
  },
  "jobs": {
    "preflight": {
      "runs-on": "ubuntu-24.04",
      "environment": "${{ inputs.environment }}",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Require explicit restore authorization",
          "env": {
            "TARGET_ENVIRONMENT": "${{ inputs.environment }}",
            "CONFIRMATION": "${{ inputs.confirmation }}"
          },
          "run": "case \"$TARGET_ENVIRONMENT:$CONFIRMATION\" in staging:'I AUTHORIZE STAGING RESTORE'|production:'I AUTHORIZE PRODUCTION RESTORE') ;; *) echo 'Restore requires the exact environment-specific confirmation phrase.' >&2; exit 1 ;; esac; echo \"Restore self-authorization confirmed by $GITHUB_ACTOR for $GITHUB_SHA\""
        },
        {
          "name": "Inspect lifecycle readiness (fails closed until implementation completes)",
          "env": {
            "TARGET_ENVIRONMENT": "${{ inputs.environment }}"
          },
          "run": "python3 scripts/platform_lifecycle.py restore --environment \"$TARGET_ENVIRONMENT\""
        }
      ]
    }
  }
}
