{
  "name": "Finalize empty staging session",
  "permissions": {
    "contents": "read",
    "checks": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "deepresearch-aws-lifecycle",
    "cancel-in-progress": false
  },
  "env": {
    "AWS_REGION": "us-east-1",
    "AWS_ACCOUNT_ID": "088759500358",
    "STATE_BUCKET": "ra-088759500358-terraform-state",
    "SESSION_ID": "${{ inputs.session_id }}",
    "OPERATION": "${{ inputs.operation }}"
  },
  "jobs": {
    "checks": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Require all checks on this commit",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPOSITORY": "${{ github.repository }}",
            "COMMIT_SHA": "${{ github.sha }}"
          },
          "run": "python3 - <<'PY'\nimport json, os, subprocess, sys, time\nrequired = {\n    \"Backend behavior\", \"Frontend behavior\", \"Frontend reproducible build\",\n    \"Container scans and SBOMs\", \"Terraform format and validate\",\n    \"Helm schema and render checks\", \"Repository checks\",\n}\ndeadline = time.monotonic() + 25 * 60\nurl = f\"repos/{os.environ['GH_REPOSITORY']}/commits/{os.environ['COMMIT_SHA']}/check-runs?per_page=100\"\nwhile time.monotonic() < deadline:\n    result = subprocess.run([\"gh\", \"api\", url], check=True, capture_output=True, text=True)\n    checks = json.loads(result.stdout)[\"check_runs\"]\n    latest = {}\n    for check in checks:\n        if check[\"name\"] in required:\n            stamp = check.get(\"started_at\") or check[\"created_at\"]\n            if check[\"name\"] not in latest or stamp > latest[check[\"name\"]][0]:\n                latest[check[\"name\"]] = (stamp, check[\"status\"], check[\"conclusion\"])\n    failed = sorted(name for name, (_, status, conclusion) in latest.items()\n                    if status == \"completed\" and conclusion != \"success\")\n    if failed:\n        sys.exit(\"Required checks failed: \" + \", \".join(failed))\n    if required <= latest.keys() and all(latest[name][1:] == (\"completed\", \"success\") for name in required):\n        print(\"All seven required checks passed for this commit.\")\n        break\n    time.sleep(15)\nelse:\n    sys.exit(\"Timed out waiting for the required checks.\")\nPY\n"
        }
      ]
    },
    "finalize": {
      "needs": "checks",
      "runs-on": "ubuntu-24.04",
      "environment": "staging",
      "timeout-minutes": 90,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Validate finalizer inputs",
          "env": {
            "CONFIRMATION": "${{ inputs.confirmation }}",
            "PLAN_RUN_ID": "${{ inputs.plan_run_id }}",
            "PLAN_ATTEMPT": "${{ inputs.plan_attempt }}",
            "PLAN_VERSION_ID": "${{ inputs.plan_version_id }}",
            "PLAN_SHA256": "${{ inputs.plan_sha256 }}",
            "PLAN_COMMIT": "${{ inputs.plan_commit }}"
          },
          "run": "set -eu\npython3 - <<'PY'\nimport os, re, sys\nif not re.fullmatch(r\"stg-[a-z0-9-]{1,12}\", os.environ[\"SESSION_ID\"]):\n    sys.exit(\"session_id must start with stg- and fit the 16-character limit\")\nif os.environ[\"OPERATION\"] not in {\"plan\", \"apply\"}:\n    sys.exit(\"Unsupported finalizer operation\")\nif os.environ[\"OPERATION\"] == \"apply\":\n    required = {\n        \"CONFIRMATION\": \"I AUTHORIZE STAGING MANAGEMENT FINALIZATION\",\n    }\n    if any(os.environ.get(key) != value for key, value in required.items()):\n        sys.exit(\"Applying requires the exact finalization confirmation phrase\")\n    for key in (\"PLAN_RUN_ID\", \"PLAN_ATTEMPT\"):\n        if not re.fullmatch(r\"[0-9]+\", os.environ.get(key, \"\")):\n            sys.exit(key.lower() + \" must be numeric\")\n    if not re.fullmatch(r\"[0-9a-f]{64}\", os.environ.get(\"PLAN_SHA256\", \"\")):\n        sys.exit(\"plan_sha256 must be a lowercase SHA256\")\n    if not re.fullmatch(r\"[0-9a-f]{40}\", os.environ.get(\"PLAN_COMMIT\", \"\")):\n        sys.exit(\"A full plan commit SHA is required\")\n    if not os.environ.get(\"PLAN_VERSION_ID\"):\n        sys.exit(\"The exact private S3 plan version is required\")\n    if os.environ[\"PLAN_COMMIT\"] != os.environ[\"GITHUB_SHA\"]:\n        sys.exit(\"Apply must use the same source commit that generated the plan\")\nPY\ntest \"$GITHUB_REF\" = refs/heads/main\n"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e",
          "with": {
            "terraform_version": "1.10.5"
          }
        },
        {
          "name": "Enter the staging OIDC role",
          "uses": "aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df",
          "with": {
            "role-to-assume": "arn:aws:iam::088759500358:role/deepresearch-staging-provisioner-github-oidc",
            "role-session-name": "staging-finalizer-${{ github.run_id }}",
            "aws-region": "us-east-1"
          }
        },
        {
          "name": "Assume the session-scoped management role",
          "run": "set -eu\ncredentials=$(aws sts assume-role \\\n  --role-arn arn:aws:iam::088759500358:role/deepresearch-staging-management-provisioner \\\n  --role-session-name \"staging-finalizer-${GITHUB_RUN_ID}\" \\\n  --tags \"Key=Session,Value=$SESSION_ID\" \"Key=Stack,Value=management\" \\\n  --duration-seconds 3600 --output json)\nprintf '%s' \"$credentials\" | python3 -c 'import json,os,sys; c=json.load(sys.stdin)[\"Credentials\"]; f=open(os.environ[\"GITHUB_ENV\"],\"a\"); [f.write(f\"{k}={c[v]}\\n\") for k,v in ((\"AWS_ACCESS_KEY_ID\",\"AccessKeyId\"),(\"AWS_SECRET_ACCESS_KEY\",\"SecretAccessKey\"),(\"AWS_SESSION_TOKEN\",\"SessionToken\"))]; f.close(); [print(f\"::add-mask::{c[v]}\") for v in (\"AccessKeyId\",\"SecretAccessKey\",\"SessionToken\")]'\nunset credentials\n"
        },
        {
          "name": "Acquire finalizer lease and verify the session is empty",
          "env": {
            "UNREGISTERED_RUNNER": "${{ inputs.unregistered_runner }}"
          },
          "run": "set -euo pipefail\nowner_file=\"$RUNNER_TEMP/staging-finalizer-owner\"\npython3 scripts/staging_lifecycle_lease.py acquire-finalizer --session-id \"$SESSION_ID\" --owner-file \"$owner_file\"\nnohup python3 scripts/staging_lifecycle_lease.py heartbeat-finalizer --session-id \"$SESSION_ID\" --owner-file \"$owner_file\" --interval 30 </dev/null >/dev/null 2>&1 &\necho \"$!\" > \"$RUNNER_TEMP/staging-finalizer-heartbeat-pid\"\necho \"STAGING_FINALIZER_OWNER_FILE=$owner_file\" >> \"$GITHUB_ENV\"\npython3 scripts/staging_lifecycle_lease.py assert-finalizer --session-id \"$SESSION_ID\" --owner-file \"$owner_file\"\ntest \"$UNREGISTERED_RUNNER\" = \"staging-$SESSION_ID\"\nmarker_key=\"app-writers#staging#$SESSION_ID\"\nmarker=$(aws dynamodb get-item --table-name deepresearch-control --consistent-read --key \"{\\\"key\\\":{\\\"S\\\":\\\"$marker_key\\\"}}\" --region \"$AWS_REGION\" --output json)\npython3 -c 'import json,sys; sys.exit(\"A deployment marker exists; data-preserving shutdown is required\") if json.loads(sys.argv[1] or \"{}\").get(\"Item\") else None' \"$marker\"\n"
        },
        {
          "name": "Verify runtime absent and initialize management state",
          "run": "set -euo pipefail\numask 077\ntest \"$(aws sts get-caller-identity --query Account --output text)\" = \"$AWS_ACCOUNT_ID\"\nif aws eks describe-cluster --name deepresearch-staging --region \"$AWS_REGION\" >/dev/null 2>\"$RUNNER_TEMP/eks-error\"; then\n  echo \"The EKS runtime exists; use the data-preserving runtime shutdown path.\" >&2\n  exit 1\nelse\n  grep -q ResourceNotFoundException \"$RUNNER_TEMP/eks-error\"\nfi\nrds_count=$(aws rds describe-db-instances --region \"$AWS_REGION\" --query 'length(DBInstances[?DBInstanceIdentifier==`deepresearch-staging`])' --output text)\ntest \"$rds_count\" = 0\ninstances=$(aws ec2 describe-instances --region \"$AWS_REGION\" \\\n  --filters \"Name=tag:Session,Values=$SESSION_ID\" \"Name=tag:Component,Values=github-actions-runner\" \\\n  --query 'Reservations[].Instances[] | [?State.Name!=`terminated`].InstanceId' --output json)\npython3 -c 'import json,sys; xs=json.loads(sys.argv[1]); sys.exit(\"A staging runner instance is not terminated: \"+str(xs)) if xs else None' \"$instances\"\nmkdir -m 700 \"$RUNNER_TEMP/staging-finalizer\"\ncat > \"$RUNNER_TEMP/staging-finalizer/terraform.tfvars.json\" <<EOF\n{\"account_id\":\"088759500358\",\"region\":\"us-east-1\",\"environment\":\"staging\",\"session_id\":\"$SESSION_ID\",\"availability_zone\":\"us-east-1a\",\"enable_github_runner\":true,\"launch_github_runner\":true,\"github_runner_ami_id\":\"ami-08b275ac6cc5dbefb\",\"github_repository\":\"sagar-spkt/DeepResearchAgent\",\"github_runner_registration_parameter\":\"/deepresearch/runner/$SESSION_ID/registration\"}\nEOF\nterraform -chdir=infra/management init -reconfigure -input=false \\\n  -backend-config=\"bucket=$STATE_BUCKET\" \\\n  -backend-config=\"key=deepresearch/staging/management.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\" -backend-config=\"encrypt=true\" -backend-config=\"use_lockfile=true\"\nterraform -chdir=infra/management output -json > \"$RUNNER_TEMP/staging-finalizer/outputs.json\"\nrunner_key=$(jq -r '.github_runner_token_kms_key_arn.value // empty' \"$RUNNER_TEMP/staging-finalizer/outputs.json\")\nrunner_key=${runner_key:-$PRIOR_RUNNER_KEY_ARN}\n[[ \"$runner_key\" =~ ^arn:aws:kms:us-east-1:088759500358:key/[a-f0-9-]{36}$ ]]\naws kms list-resource-tags --key-id \"$runner_key\" --output json | jq -e --arg session \"$SESSION_ID\" '(.Tags | map({key:.TagKey,value:.TagValue}) | from_entries) | .Project==\"deepresearch\" and .Environment==\"staging\" and .Session==$session and .Component==\"github-runner-token-key\"' >/dev/null\nprintf '%s' \"$runner_key\" > \"$RUNNER_TEMP/staging-finalizer/runner-key-arn\"\naws s3api get-object --bucket \"$STATE_BUCKET\" --key deepresearch/staging/foundation.tfstate \"$RUNNER_TEMP/staging-finalizer/foundation.tfstate\" >/dev/null\npython3 - \"$RUNNER_TEMP/staging-finalizer/foundation.tfstate\" \"$RUNNER_TEMP/staging-finalizer/runner-key-arn\" \"$RUNNER_TEMP/staging-finalizer/lifecycle-config.json\" <<'PY'\nimport json,os,sys\nfrom pathlib import Path\nstate=json.load(open(sys.argv[1]))\nfoundation=state[\"outputs\"][\"foundation\"][\"value\"]\nbuckets=foundation[\"buckets\"]\nconfig={\"account_id\":\"088759500358\",\"region\":\"us-east-1\",\"environment\":\"staging\",\"session_id\":os.environ[\"SESSION_ID\"],\"cluster_name\":\"deepresearch-staging\",\"database_identifier\":\"deepresearch-staging\",\"document_bucket\":buckets[\"documents\"],\"backup_bucket\":buckets[\"backups\"],\"trace_bucket\":buckets[\"traces\"],\"user_pool_id\":foundation[\"user_pool_id\"],\"alert_topic_arn\":foundation[\"alert_topic_arn\"],\"alert_kms_key_arn\":foundation[\"alert_kms_key_arn\"],\"github_runner_enabled\":True,\"runner_token_kms_key_arn\":Path(sys.argv[2]).read_text().strip()}\nwith open(sys.argv[3],\"w\") as target: json.dump(config,target,sort_keys=True)\nos.chmod(sys.argv[3],0o600)\nPY\n",
          "env": {
            "PRIOR_RUNNER_KEY_ARN": "${{ inputs.prior_runner_key_arn }}"
          }
        },
        {
          "name": "Create and validate private destroy plan or apply the exact saved version",
          "env": {
            "PLAN_RUN_ID": "${{ inputs.plan_run_id }}",
            "PLAN_ATTEMPT": "${{ inputs.plan_attempt }}",
            "PLAN_VERSION_ID": "${{ inputs.plan_version_id }}",
            "PLAN_SHA256": "${{ inputs.plan_sha256 }}",
            "PLAN_COMMIT": "${{ inputs.plan_commit }}"
          },
          "run": "set -euo pipefail\npython3 scripts/staging_lifecycle_lease.py assert-finalizer --session-id \"$SESSION_ID\" --owner-file \"$STAGING_FINALIZER_OWNER_FILE\"\ntmp=\"$RUNNER_TEMP/staging-finalizer\"\nif [ \"$OPERATION\" = plan ]; then\n  plan_run_id=$GITHUB_RUN_ID\n  plan_attempt=$GITHUB_RUN_ATTEMPT\n  terraform -chdir=infra/management plan -destroy -input=false -no-color \\\n    -var-file=\"$tmp/terraform.tfvars.json\" -out=\"$tmp/management.tfplan\" > \"$tmp/plan.log\"\n  terraform -chdir=infra/management show -json \"$tmp/management.tfplan\" > \"$tmp/management-plan.json\"\n  python3 scripts/validate_management_finalizer_plan.py --plan-json \"$tmp/management-plan.json\" --session-id \"$SESSION_ID\"\n  plan_sha=$(sha256sum \"$tmp/management.tfplan\" | awk '{print $1}')\n  key=\"deepresearch/staging/plans/$SESSION_ID/finalize-management/$GITHUB_SHA/$plan_run_id-$plan_attempt.tfplan\"\n  created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n  result=$(aws s3api put-object --bucket \"$STATE_BUCKET\" --key \"$key\" --body \"$tmp/management.tfplan\" \\\n    --server-side-encryption AES256 --content-type application/octet-stream \\\n    --metadata \"stack=finalize-management,session-id=$SESSION_ID,commit-sha=$GITHUB_SHA,run-id=$plan_run_id,run-attempt=$plan_attempt,sha256=$plan_sha,created-at=$created_at\")\n  version=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"VersionId\"])' \"$result\")\n  python3 - \"$tmp/management-plan.json\" \"$GITHUB_STEP_SUMMARY\" \"$plan_run_id\" \"$plan_attempt\" \"$version\" \"$plan_sha\" <<'PY'\nimport json,os,sys\nplan=json.load(open(sys.argv[1]))\nwith open(sys.argv[2],\"a\") as out:\n    out.write(\"## Validated empty-session management destroy plan\\n\\n\")\n    for item in plan.get(\"resource_changes\",[]):\n        if item[\"change\"][\"actions\"] != [\"no-op\"]:\n            out.write(f\"- `{item['address']}`: `{', '.join(item['change']['actions'])}`\\n\")\n    out.write(\"\\nNo EKS/RDS runtime or application state is included. The encrypted Terraform plan is stored in the private versioned state bucket.\\n\\n\")\n    out.write(f\"Apply inputs: run `{sys.argv[3]}`, attempt `{sys.argv[4]}`, version `{sys.argv[5]}`, SHA256 `{sys.argv[6]}`, commit `{os.environ['GITHUB_SHA']}`.\\n\")\nPY\nelse\n  test \"$PLAN_COMMIT\" = \"$GITHUB_SHA\"\n  key=\"deepresearch/staging/plans/$SESSION_ID/finalize-management/$PLAN_COMMIT/$PLAN_RUN_ID-$PLAN_ATTEMPT.tfplan\"\n  head=$(aws s3api head-object --bucket \"$STATE_BUCKET\" --key \"$key\" --version-id \"$PLAN_VERSION_ID\")\n  python3 - \"$head\" \"$SESSION_ID\" \"$PLAN_RUN_ID\" \"$PLAN_ATTEMPT\" \"$PLAN_SHA256\" \"$PLAN_COMMIT\" <<'PY'\nimport json,sys\nfrom datetime import datetime,timezone\nmeta=json.loads(sys.argv[1])[\"Metadata\"]\nexpected={\"stack\":\"finalize-management\",\"session-id\":sys.argv[2],\"run-id\":sys.argv[3],\"run-attempt\":sys.argv[4],\"sha256\":sys.argv[5],\"commit-sha\":sys.argv[6]}\nif any(meta.get(k)!=v for k,v in expected.items()): raise SystemExit(\"Saved plan metadata does not match the apply inputs\")\ncreated=datetime.strptime(meta[\"created-at\"],\"%Y-%m-%dT%H:%M:%SZ\").replace(tzinfo=timezone.utc)\nif (datetime.now(timezone.utc)-created).total_seconds()>3600: raise SystemExit(\"Saved plan is older than one hour\")\nPY\n  aws s3api get-object --bucket \"$STATE_BUCKET\" --key \"$key\" --version-id \"$PLAN_VERSION_ID\" \"$tmp/management.tfplan\" >/dev/null\n  test \"$(sha256sum \"$tmp/management.tfplan\" | awk '{print $1}')\" = \"$PLAN_SHA256\"\n  terraform -chdir=infra/management show -json \"$tmp/management.tfplan\" > \"$tmp/management-plan.json\"\n  python3 scripts/validate_management_finalizer_plan.py --plan-json \"$tmp/management-plan.json\" --session-id \"$SESSION_ID\"\n  python3 scripts/staging_lifecycle_lease.py assert-finalizer --session-id \"$SESSION_ID\" --owner-file \"$STAGING_FINALIZER_OWNER_FILE\"\n  test \"$(aws ec2 describe-instances --region \"$AWS_REGION\" --filters \"Name=tag:Session,Values=$SESSION_ID\" \"Name=tag:Component,Values=github-actions-runner\" --query 'length(Reservations[].Instances[] | [?State.Name!=`terminated`])' --output text)\" = 0\n  if aws eks describe-cluster --name deepresearch-staging --region \"$AWS_REGION\" >/dev/null 2>\"$tmp/eks-error\"; then\n    echo \"The EKS runtime appeared during finalization.\" >&2; exit 1\n  else\n    grep -q ResourceNotFoundException \"$tmp/eks-error\"\n  fi\n  test \"$(aws rds describe-db-instances --region \"$AWS_REGION\" --query 'length(DBInstances[?DBInstanceIdentifier==`deepresearch-staging`])' --output text)\" = 0\n  if aws ssm get-parameter --name \"/deepresearch/runner/$SESSION_ID/registration\" --region \"$AWS_REGION\" --query Parameter.Type --output text >/dev/null 2>\"$tmp/parameter-error\"; then\n    aws ssm delete-parameter --name \"/deepresearch/runner/$SESSION_ID/registration\" --region \"$AWS_REGION\" >/dev/null\n  else\n    grep -Eq \"ParameterNotFound|ParameterNotFoundException\" \"$tmp/parameter-error\"\n  fi\n  terraform -chdir=infra/management apply -input=false -no-color \"$tmp/management.tfplan\"\n  test \"$(aws ec2 describe-vpcs --region \"$AWS_REGION\" --filters \"Name=tag:Session,Values=$SESSION_ID\" --query 'length(Vpcs)' --output text)\" = 0\n  test \"$(aws ec2 describe-nat-gateways --region \"$AWS_REGION\" --filter \"Name=tag:Session,Values=$SESSION_ID\" --query 'length(NatGateways[?State!=`deleted`])' --output text)\" = 0\n  marker=$(aws dynamodb get-item --table-name deepresearch-control --consistent-read --key \"{\\\"key\\\":{\\\"S\\\":\\\"app-writers#staging#$SESSION_ID\\\"}}\" --region \"$AWS_REGION\" --output json)\n  python3 -c 'import json,sys; sys.exit(\"A deployment marker appeared during finalization\") if json.loads(sys.argv[1] or \"{}\").get(\"Item\") else None' \"$marker\"\n  python3 - \"$RUNNER_TEMP/staging-finalizer/management-cleanup-receipt.json\" \"$PLAN_SHA256\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" <<'PY'\nimport json,os,sys\nfrom pathlib import Path\ntarget=Path(sys.argv[1])\nconfig=json.load(open(target.parent/\"lifecycle-config.json\"))\nreceipt={\"operation\":\"staging-management-finalizer-receipt\",\"config\":config,\"executed\":True,\"runner_terminated\":True,\"runner_unregistered\":True,\"runtime_verified_absent\":True,\"terraform_destroy_plan_sha256\":sys.argv[2],\"commit_sha\":sys.argv[3],\"workflow_run_id\":sys.argv[4],\"snapshots\":\"not-applicable-no-runtime-database-existed\",\"refund\":\"none\"}\ntarget.write_text(json.dumps(receipt,indent=2)+\"\\n\"); target.chmod(0o600)\nprint(json.dumps({\"receipt_sha256\":__import__(\"hashlib\").sha256(target.read_bytes()).hexdigest()}))\nPY\n  receipt_key=\"deepresearch/staging/plans/$SESSION_ID/finalize-management/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-receipt.json\"\n  receipt_result=$(aws s3api put-object --bucket \"$STATE_BUCKET\" --key \"$receipt_key\" --body \"$RUNNER_TEMP/staging-finalizer/management-cleanup-receipt.json\" --server-side-encryption AES256 --content-type application/json)\n  receipt_version=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"VersionId\"])' \"$receipt_result\")\n  config_key=\"deepresearch/staging/plans/$SESSION_ID/finalize-management/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-lifecycle-config.json\"\n  config_result=$(aws s3api put-object --bucket \"$STATE_BUCKET\" --key \"$config_key\" --body \"$RUNNER_TEMP/staging-finalizer/lifecycle-config.json\" --server-side-encryption AES256 --content-type application/json)\n  config_version=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[\"VersionId\"])' \"$config_result\")\n  echo \"Empty-session cleanup receipt stored privately at version $receipt_version; key: $receipt_key. Lifecycle config stored at version $config_version; key: $config_key.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
        },
        {
          "name": "Stop heartbeat, release lease and remove temporary files",
          "if": "always()",
          "run": "if [ -f \"$RUNNER_TEMP/staging-finalizer-heartbeat-pid\" ]; then kill \"$(cat \"$RUNNER_TEMP/staging-finalizer-heartbeat-pid\")\" 2>/dev/null || true; fi\nif [ -f \"$RUNNER_TEMP/staging-finalizer-owner\" ]; then python3 scripts/staging_lifecycle_lease.py release --session-id \"$SESSION_ID\" --owner-file \"$RUNNER_TEMP/staging-finalizer-owner\" || true; fi\nrm -rf \"$RUNNER_TEMP/staging-finalizer\" \"$RUNNER_TEMP/staging-finalizer-owner\" \"$RUNNER_TEMP/staging-finalizer-owner.heartbeat\" \"$RUNNER_TEMP/staging-finalizer-owner.lost\" \"$RUNNER_TEMP/staging-finalizer-heartbeat-pid\"\n"
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "operation": {
          "description": "Create a private delete-only plan or apply its exact saved version",
          "type": "choice",
          "options": [
            "plan",
            "apply"
          ],
          "default": "plan",
          "required": true
        },
        "session_id": {
          "description": "The active empty staging admission ID",
          "type": "string",
          "required": true
        },
        "confirmation": {
          "description": "For apply, enter I AUTHORIZE STAGING MANAGEMENT FINALIZATION",
          "type": "string",
          "required": false
        },
        "plan_run_id": {
          "description": "GitHub run ID returned by plan",
          "type": "string",
          "required": false
        },
        "plan_attempt": {
          "description": "GitHub run attempt returned by plan",
          "type": "string",
          "required": false
        },
        "plan_version_id": {
          "description": "Private S3 plan VersionId returned by plan",
          "type": "string",
          "required": false
        },
        "plan_sha256": {
          "description": "SHA256 returned by plan",
          "type": "string",
          "required": false
        },
        "plan_commit": {
          "description": "Source commit SHA returned by plan",
          "type": "string",
          "required": false
        },
        "unregistered_runner": {
          "description": "Exact runner name verified absent by dispatching repository administrator",
          "required": true,
          "type": "string"
        },
        "prior_runner_key_arn": {
          "description": "Original session runner KMS key ARN when partial teardown already removed Terraform outputs",
          "required": false,
          "type": "string"
        }
      }
    }
  }
}
