{
  "name": "Prepare promote",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "choice",
          "options": [
            "staging",
            "production"
          ],
          "required": true,
          "default": "staging"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "deepresearch-aws-lifecycle",
    "cancel-in-progress": false
  },
  "jobs": {
    "preflight": {
      "runs-on": "ubuntu-24.04",
      "environment": "${{ inputs.environment }}",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Inspect lifecycle readiness (fails closed until implementation completes)",
          "env": {
            "TARGET_ENVIRONMENT": "${{ inputs.environment }}"
          },
          "run": "python3 scripts/platform_lifecycle.py promote --environment \"$TARGET_ENVIRONMENT\""
        }
      ]
    }
  }
}
