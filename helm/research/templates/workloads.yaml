{{- $root := . -}}
{{- range $name := list "api" "worker" "web" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-{{ $name }}
spec:
  replicas: 1
  # A single node has no headroom for surge pods during rolling updates.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: research, component: {{ $name }} }
  template:
    metadata:
      labels: { app: research, component: {{ $name }} }
    spec:
      serviceAccountName: research-{{ if eq $name "web" }}web{{ else }}application{{ end }}
      {{- if eq $name "web" }}
      automountServiceAccountToken: false
      {{- end }}
      nodeSelector: { workload: cpu }
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: {{ $name }}
          image: {{ if eq $name "web" }}{{ required "webImage must be an immutable image digest" $root.Values.webImage | quote }}{{ else }}{{ required "backendImage must be an immutable image digest" $root.Values.backendImage | quote }}{{ end }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "api" }}
          command: ["uvicorn", "research_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 30 }
          {{- else if eq $name "worker" }}
          command: ["python", "-m", "research_app.worker"]
          {{- else }}
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10 }
          {{- end }}
          env:
            {{- if eq $name "web" }}
            - { name: APP_ENV, value: {{ $root.Values.environment | quote }} }
            - { name: AUTH_MODE, value: cognito }
            - { name: API_INTERNAL_URL, value: "http://research-api:8000" }
            {{- end }}
            - { name: ENVIRONMENT, value: {{ $root.Values.environment | quote }} }
            - { name: MODEL_PROVIDER, value: bedrock }
            - { name: BEDROCK_MODEL_ID, value: {{ $root.Values.model.bedrockModelId | quote }} }
            - { name: STORAGE_BACKEND, value: s3 }
            - { name: EMBEDDING_PROVIDER, value: sentence-transformers }
          {{- if ne $name "web" }}
          envFrom: [{ secretRef: { name: {{ $root.Values.applicationSecret }} } }]
          {{- else }}
          envFrom: [{ secretRef: { name: {{ $root.Values.webSecret }} } }]
          {{- end }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: {{ if eq $name "worker" }}"1000m"{{ else }}"250m"{{ end }}, memory: {{ if eq $name "worker" }}"2Gi"{{ else }}"512Mi"{{ end }} }
            limits: { cpu: "2000m", memory: {{ if eq $name "worker" }}"4Gi"{{ else }}"1Gi"{{ end }} }
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-web
automountServiceAccountToken: false
---
{{ range $name := list "api" "web" }}
apiVersion: v1
kind: Service
metadata:
  name: research-{{ $name }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ if eq $name "api" }}"/readyz"{{ else }}"/"{{ end }}
spec:
  type: ClusterIP
  selector: { app: research, component: {{ $name }} }
  ports: [{ name: http, port: {{ if eq $name "api" }}8000{{ else }}3000{{ end }}, targetPort: http }]
---
{{ end }}
