{{- if .Values.console.enabled }}
{{- $host := required "Application hostname required for console" .Values.ingress.host }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9.-]+[a-z0-9]$" $host) }}
{{- fail "Invalid application hostname" }}
{{- end }}
{{- if not .Values.ingress.enabled }}
{{- fail "Console requires HTTPS ingress" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: { name: research-console }
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      access_log off;
      error_log /dev/stderr warn;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      # Authentication subrequests receive the application cookie. The native
      # console receives only its own cookies, never the replayable app session.
      map $http_cookie $cookie_without_leading_session {
        default $http_cookie;
        "~^research_session=[^;]*(?:;[[:space:]]*)?(?<session_tail>.*)$" $session_tail;
      }
      map $cookie_without_leading_session $native_cookie {
        default $cookie_without_leading_session;
        "~^(?<session_head>.+?);[[:space:]]*research_session=[^;]*(?<session_suffix>;.*|)$" "$session_head$session_suffix";
      }
      server {
        listen 8080;
        server_name observability.{{ $host }};
        client_max_body_size 2m;
        location = /healthz { return 200 'ok'; }
        location = /_admin_access {
          internal;
          proxy_pass http://research-web:3000/api/admin/access;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
        }
        location / {
          auth_request /_admin_access;
          proxy_pass http://langfuse:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Cookie $native_cookie;
          proxy_set_header Upgrade "";
          proxy_set_header Connection "";
          proxy_read_timeout 60s;
          proxy_buffering off;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: research-console }
spec:
  replicas: 1
  selector:
    matchLabels: { app: research, component: console }
  template:
    metadata:
      labels: { app: research, component: console }
    spec:
      serviceAccountName: research-web
      automountServiceAccountToken: false
      nodeSelector: { workload: cpu }
      securityContext: { runAsNonRoot: true, runAsUser: 101, fsGroup: 101 }
      containers:
        - name: nginx
          image: {{ required "Pinned unprivileged NGINX image required" .Values.console.image | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: research-console }
        - name: temporary
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: research-console }
spec:
  selector: { app: research, component: console }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-console
  annotations:
    alb.ingress.kubernetes.io/group.name: research-{{ .Values.environment }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: observability.{{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: research-console, port: { number: 8080 } } }
{{- end }}
