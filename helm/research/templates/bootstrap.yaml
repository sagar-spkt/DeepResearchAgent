# Creates the application/Langfuse database roles and the pgvector extension
# before migrations run. Idempotent; uses the RDS master credentials from a
# Secret the deploy workflow creates.
apiVersion: batch/v1
kind: Job
metadata:
  name: research-db-bootstrap-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: { app: research, component: db-bootstrap }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: { workload: cpu }
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: bootstrap
          image: {{ required "backendImage required" .Values.backendImage | quote }}
          command: ["python", "-m", "research_app.bootstrap_db"]
          envFrom: [{ secretRef: { name: {{ .Values.bootstrapSecret }} } }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
