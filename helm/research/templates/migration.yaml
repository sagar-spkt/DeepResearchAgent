apiVersion: batch/v1
kind: Job
metadata:
  name: research-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: { app: research, component: migration }
    spec:
      restartPolicy: Never
      serviceAccountName: research-application
      nodeSelector: { workload: cpu }
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: migrate
          image: {{ required "backendImage required" .Values.backendImage | quote }}
          command: ["python", "-m", "research_app.manage", "migrate"]
          envFrom: [{ secretRef: { name: {{ .Values.applicationSecret }} } }]
          env:
            - { name: ENVIRONMENT, value: {{ .Values.environment | quote }} }
            - { name: MODEL_PROVIDER, value: bedrock }
            - { name: BEDROCK_MODEL_ID, value: {{ .Values.model.bedrockModelId | quote }} }
            - { name: STORAGE_BACKEND, value: s3 }
            - { name: EMBEDDING_PROVIDER, value: sentence-transformers }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
