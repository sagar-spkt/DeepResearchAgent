apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: private-model }
spec:
  podSelector:
    matchLabels: { app: research, component: vllm }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: research, component: api }
        - podSelector:
            matchLabels: { app: research, component: worker }
      ports: [{ protocol: TCP, port: 8000 }]
