{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research
  annotations:
    alb.ingress.kubernetes.io/group.name: research-{{ .Values.environment }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ACM certificate ARN required" .Values.ingress.certificateArn | quote }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "HTTPS hostname required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: research-web, port: { number: 3000 } } }
{{- end }}
