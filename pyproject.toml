[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Self-hosted multiuser Deep Agents research service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.49.0", "sqlalchemy==2.0.52",
  "psycopg==3.3.6", "pydantic-settings==2.15.0", "PyJWT[crypto]==2.13.0",
  "python-multipart==0.0.32", "boto3==1.43.119", "httpx==0.28.1", "pypdf==6.21.4",
  "deepagents==0.7.0", "langchain-openai==1.6.2",
  "langgraph-checkpoint-postgres==3.2.0", "langgraph-checkpoint-sqlite==3.1.1"
]

[project.optional-dependencies]
bedrock = ["langchain-aws==1.7.3"]
local-postgres = ["psycopg[binary]==3.3.6"]
embeddings = ["sentence-transformers==5.7.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==1.20.2"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/research_app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
